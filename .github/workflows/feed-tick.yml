# Calls /api/feed/tick every 5 minutes during A3 grain market hours (Mon–Fri, 10:30–17:00
# Argentina time = 13:30–20:00 UTC). Vercel Hobby crons run at most once a day, and GitHub
# Actions are free for public repositories. GitHub may delay scheduled runs by a few minutes.
#
# Setup: add repository secrets APP_URL (e.g. https://shipagro.vercel.app) and CRON_SECRET
# (the same value as the Vercel env var). The job does nothing until both are set.
name: Feed tick

on:
  schedule:
    - cron: '*/5 13-19 * * 1-5'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/feed/tick
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET not set; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/feed/tick"
